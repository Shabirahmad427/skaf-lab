# Skaf Lab color theme — warm, understated academic palette
name = "Skaf Lab"

[light]
  # Primary
  primary = "#7A2E2E"

  # Menu
  menu_primary = "#FFFFFF"
  menu_text = "#3A3229"
  menu_text_active = "#7A2E2E"
  menu_title = "#2B241C"

  # Links
  link = "#7A2E2E"
  link_hover = "#4E1D1D"
  link_decoration = "underline"

  # Home sections
  home_section_odd = "#FEFCF8"
  home_section_even = "#F5F0E6"

[dark]
  # Primary
  primary = "#D9A441"

  # Menu
  menu_primary = "#1B1712"
  menu_text = "#E9E2D3"
  menu_text_active = "#D9A441"
  menu_title = "#F5F0E6"

  # Links
  link = "#D9A441"
  link_hover = "#EBC272"
  link_decoration = "underline"

  # Home sections
  home_section_odd = "#17140F"
  home_section_even = "#1D1913"
