# SITE SETUP
# -----------

# Website type
site_type: Group

# Local time zone
time_zone: America/Sao_Paulo

# Appearance
appearance:
  theme_day: skaflab
  theme_night: skaflab
  font: skaflab
  font_size: L

# Extensions
extensions:
  academicons:
    enable: true

# SEO
marketing:
  seo:
    site_type: Organization
    local_business_type: ''
    org_name: 'Skaf Lab - IQ Unicamp'
    description: 'Computational Biophysical Chemistry Group at the Institute of Chemistry, University of Campinas (Unicamp), Brazil.'
    twitter: ''

# Contact
contact_links:
  - icon: envelope
    icon_pack: fas
    name: Email
    link: 'mailto:skaf@iqm.unicamp.br'
  - icon: graduation-cap
    icon_pack: fas
    name: Google Scholar
    link: 'https://scholar.google.com/citations?user=yyRa2dcAAAAJ'
  - icon: researchgate
    icon_pack: fab
    name: ResearchGate
    link: 'https://www.researchgate.net/profile/Munir-Skaf'
  - icon: github
    icon_pack: fab
    name: GitHub
    link: 'https://github.com/cepid-cces'

# Address
address:
  street: Rua Josué de Castro, s/n - Cidade Universitária
  city: Campinas
  region: SP
  postcode: '13083-861'
  country: Brazil
  country_code: BR

# Coordinates (for map)
coordinates:
  latitude: '-22.8185'
  longitude: '-47.0664'

# Directions
directions: Instituto de Química (IQ), Unicamp - Campinas, SP, Brazil

office_hours:
  - 'Monday–Friday, 09:00–18:00'

# Map
map:
  provider: google
  api_key: ''
  zoom: 15

# Social sharing
sharing:
  twitter: true

# Publication
publications:
  date_format: January 2006
  citation_style: apa

# Search
search:
  provider: wowchemy

# Comments
comments:
  provider: ''

# Content Management System
cms:
  branch: main

# Avatar
avatar:
  gravatar: false
  shape: circle

# Footer
footer:
  copyright:
    notice: '© {year} Skaf Lab, IQ Unicamp. Powered by [Hugo Blox](https://hugoblox.com).'
    license:
      enable: false
